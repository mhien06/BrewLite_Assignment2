rif" font-size="21.0" font-weight="normal" text-anchor="middle" x="1010.0" y="743.2800000000001">Kiểm tra giỏ, sản phẩm,</ns0:text><ns0:text fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="21.0" font-weight="normal" text-anchor="middle" x="1010.0" y="769.32">size, topping, số lượng</ns0:text><ns0:polygon fill="#FFFFFF" points="1010.0,848.0 1140.0,908.0 1010.0,968.0 880.0,908.0" stroke="#111111" stroke-width="2.0" /><ns0:text fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="19.0" font-weight="normal" text-anchor="middle" x="1010.0" y="901.9200000000001">Sản phẩm đang bán</ns0:text><ns0:text fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="19.0" font-weight="normal" text-anchor="middle" x="1010.0" y="925.48">và dữ liệu hợp lệ?</ns0:text><ns0:rect fill="#FFFFFF" height="86.0" rx="12" ry="12" stroke="#111111" stroke-width="2.0" width="355.0" x="167.5" y="865.0" /><ns0:text fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="21.0" font-weight="normal" text-anchor="middle" x="345.0" y="901.2800000000001">Báo món ngừng bán /</ns0:text><ns0:text fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="21.0" font-weight="normal" text-anchor="middle" x="345.0" y="927.32">hết hàng / giỏ không hợp lệ</ns0:text><ns0:ellipse cx="345.0" cy="1046.0" fill="#FFFFFF" rx="13.0" ry="13.0" stroke="#111111" stroke-width="3.0" /><ns0:ellipse cx="345.0" cy="1046.0" fill="#111111" rx="9.0" ry="9.0" stroke="#111111" stroke-width="1.0" /><ns0:rect fill="#FFFFFF" height="86.0" rx="12" ry="12" stroke="#111111" stroke-width="2.0" width="390.0" x="815.0" y="1085.0" /><ns0:text fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="21.0" font-weight="normal" text-anchor="middle" x="1010.0" y="1121.28">Tính lại giá tại backend;</ns0:text><ns0:text fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="21.0" font-weight="normal" text-anchor="middle" x="1010.0" y="1147.32">kiểm tra điể